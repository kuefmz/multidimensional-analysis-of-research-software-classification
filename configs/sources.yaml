sources:
  joss:
    name: Journal of Open Source Software
    role: development_seed
    acquisition: frozen_csv
    url: https://gist.githubusercontent.com/andrew/627fd9cfe97eaf7f779e3c755c4fffa8/raw/0290a0dcbf3d867c75051662808ef07e0470170e/joss_keywords.csv
    expected_records: 3278
    snapshot_type: frozen
    classification_fields:
      - joss_tags
      - repository_topics
    excluded_fields:
      - combined_keywords
    status: collected
    notes: >
      Initial development corpus supplied by Andrew. The frozen CSV contains
      3,278 data records (3,279 lines including the header). Preserve JOSS tags
      and GitHub repository topics separately; combined_keywords is excluded to
      avoid double counting.

  semrepo:
    name: SemRepo
    role: rq1_source
    acquisition: versioned_zenodo_ntriples_dump
    url: https://doi.org/10.5281/zenodo.20084784
    diagnostic_endpoint: https://semrepo.org/sparql
    classification_fields:
      - repository_topic
      - programming_language
    excluded_initial_fields:
      - package
    status: collector_ready
    notes: >
      The public SPARQL endpoint exposed only 952 repository entities in the
      2026-09-28 audit, far below the released ~197k-repository dataset.
      Use the versioned Zenodo N-Triples dump as the primary RQ1 source.

  biotools:
    name: bio.tools
    role: rq1_source
    acquisition: api
    snapshot_type: retrieval_date
    url: https://bio.tools/api/t/?format=json
    classification_fields:
      - edam_topic
      - edam_operation
    excluded_initial_fields:
      - edam_data
      - edam_format
      - tool_type
      - programming_language
      - operating_system
    status: collector_ready
    notes: >
      The production API returned HTTP 521 to a GitHub-hosted runner during the
      2026-09-28 smoke test. Run from a permitted local environment or retry the
      manual workflow when service connectivity is restored.

  paperswithcode:
    name: Papers with Code / Linked Papers with Code
    role: rq1_source
    acquisition: frozen_huggingface_archive
    snapshot_type: frozen_2025-07-28
    url: https://huggingface.co/datasets/pwc-archive/papers-with-abstracts
    classification_fields:
      - area
      - task
      - method
      - method_collection
      - collection_parent
    status: collected
    full_snapshot_records: 576261
    records_with_extracted_labels: 469717
    typed_label_rows: 19963
    notes: >
      Full frozen archive extraction completed on 2026-09-28. A structural
      quality audit flags 3,420 typed labels as poor annotation units, almost
      entirely in the method vocabulary. Preserve all raw labels but exclude
      explicitly flagged rows from pilot sampling.

  github:
    name: GitHub
    role: rq1_source
    acquisition: api_or_existing_kg
    classification_fields:
      - topics
      - languages
    status: planned

  openalex:
    name: OpenAlex
    role: rq1_context_source
    acquisition: api
    classification_fields:
      - topics
    status: planned

  openaire:
    name: OpenAIRE
    role: rq1_source
    acquisition: api_or_dump
    classification_fields:
      - subjects
      - keywords
    status: planned

  orkg:
    name: ORKG
    role: rq1_source
    acquisition: api
    classification_fields:
      - software_related_concepts
    status: planned

  awesome_lists:
    name: Awesome Lists
    role: rq3_held_out_validation
    acquisition: github
    classification_fields:
      - list_heading
      - category_heading
    status: hold_out
