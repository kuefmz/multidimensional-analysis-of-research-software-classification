name: build-biotools-static-artifacts

on:
  push:
    branches: [dev]
    paths:
      - "src/biotools_gitcontent_collector.py"
      - ".github/workflows/build-biotools-static-artifacts.yml"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Clone static research software content snapshot
        run: git clone --depth 1 https://github.com/research-software-ecosystem/content.git /tmp/rse-content
      - name: Capture source revision
        run: git -C /tmp/rse-content rev-parse HEAD > /tmp/rse-content-revision.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect native bio.tools EDAM labels
        shell: bash
        run: |
          revision=$(cat /tmp/rse-content-revision.txt)
          python src/biotools_gitcontent_collector.py             --input /tmp/rse-content             --source-revision "$revision"
      - name: Show summary
        run: |
          cat data/raw/biotools/gitcontent_provenance.json
          echo
          head -n 30 data/interim/biotools_label_frequencies.csv
      - uses: actions/upload-artifact@v4
        with:
          name: biotools-static-rq1-artifacts
          if-no-files-found: error
          retention-days: 30
          path: |
            data/raw/biotools/gitcontent_provenance.json
            data/interim/biotools_label_frequencies.csv
